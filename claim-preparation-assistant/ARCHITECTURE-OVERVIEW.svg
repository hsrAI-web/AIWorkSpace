<polygon points="888.0,910.0 874.5,916.5 874.5,903.5" fill="#087F8C"/>
<rect x="896" y="795" width="360" height="230" rx="16" fill="#FFFFFF" stroke="#A5C4CA" stroke-width="2"/>
