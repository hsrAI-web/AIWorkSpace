<text x="80" y="1370" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#18333B">Scope: reimbursement paperwork. Approval and live status are out of scope. Automated checks do not guarantee correctness.</text>
</svg>