<text x="86" y="713" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#087F8C">2   Handle a question</text>
<text x="600" y="721" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#526C76">LangGraph controls the sequence</text>
