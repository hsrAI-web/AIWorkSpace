<text x="1370" y="1260" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#3968B0">NEBIUS API</text>
<text x="1550" y="1260" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#526C76">Draft generation and model audit</text>
