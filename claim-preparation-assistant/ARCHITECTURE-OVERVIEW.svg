<text x="2080" y="358" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Prepared document store</text>
<text x="2080" y="413" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">JSON chunks + NumPy vectors</text>
<text x="2080" y="451" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">BM25 index built on load</text>
