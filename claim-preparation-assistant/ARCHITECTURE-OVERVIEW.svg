<text x="536" y="823" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Scope &amp; checklist</text>
<text x="536" y="878" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Clarify missing scope</text>
<text x="536" y="916" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#526C76">Build a rules-based checklist</text>
