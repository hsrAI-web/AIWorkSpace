<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>Health claim preparation assistant architecture</title>
<desc>Two lanes show local document preparation and the LangGraph question-answering workflow. Hybrid retrieval feeds optional Nebius generation and validation. Checklist and source evidence remain available when no AI answer is generated.</desc>
<rect width="2560" height="1440" fill="white"/>
<text x="80" y="62" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="60" font-weight="700" fill="#18333B">Health claim preparation assistant</text>
<text x="80" y="148" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="400" fill="#526C76">From official documents to a source-backed checklist and a cited draft answer</text>
<rect x="56" y="230" width="2448" height="350" rx="22" fill="#F1F8F9"/>
<text x="86" y="253" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#087F8C">1   Prepare the knowledge base</text>
<text x="795" y="261" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#526C76">Run when source documents change</text>
