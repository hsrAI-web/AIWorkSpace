<rect x="1568" y="354" width="5" height="147" rx="2" fill="#087F8C"/>
<text x="1592" y="358" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Local embeddings</text>
<text x="1592" y="413" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">BGE small · 384 dimensions</text>
<text x="1592" y="451" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">FastEmbed on the local CPU</text>
