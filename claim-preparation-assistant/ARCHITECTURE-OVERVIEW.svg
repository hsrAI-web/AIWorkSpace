<text x="944" y="823" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Hybrid retrieval</text>
<text x="944" y="878" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526C76">Dense + BM25 → rank fusion</text>
<text x="944" y="916" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Rerank 10 → return top 5</text>
