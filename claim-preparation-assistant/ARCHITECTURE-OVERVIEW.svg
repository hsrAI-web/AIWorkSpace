<text x="128" y="413" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Claim manual + reviewed form</text>
<text x="128" y="451" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Product version, URLs, page refs</text>
<polyline points="528,428 560,428" fill="none" stroke="#087F8C" stroke-width="4"/>
<polygon points="560.0,428.0 546.5,434.5 546.5,421.5" fill="#087F8C"/>
<rect x="568" y="330" width="448" height="195" rx="16" fill="#FFFFFF" stroke="#A5C4CA" stroke-width="2"/>
<rect x="592" y="354" width="5" height="147" rx="2" fill="#087F8C"/>
<text x="616" y="358" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Extract &amp; clean</text>
<text x="616" y="413" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">pypdf: page-by-page extraction</text>
<text x="616" y="451" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Remove repeated boilerplate</text>
<polyline points="1016,428 1048,428" fill="none" stroke="#087F8C" stroke-width="4"/>
<polygon points="1048.0,428.0 1034.5,434.5 1034.5,421.5" fill="#087F8C"/>
<rect x="1056" y="330" width="448" height="195" rx="16" fill="#FFFFFF" stroke="#A5C4CA" stroke-width="2"/>
<rect x="1080" y="354" width="5" height="147" rx="2" fill="#087F8C"/>
<text x="1104" y="358" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#18333B">Section-aware chunks</text>
<text x="1104" y="413" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Keep clauses and conditions</text>
<text x="1104" y="451" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#526C76">Preserve source metadata</text>
