kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash ../../scripts/run-api-stack.sh development"

[services.production]

[services.production.build]
args = ["bash", "scripts/build-api-stack.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "scripts/run-api-stack.sh", "production"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PARTNER_AGENT_PORT = "8000"

[services.production.health.startup]
path = "/api/healthz"
