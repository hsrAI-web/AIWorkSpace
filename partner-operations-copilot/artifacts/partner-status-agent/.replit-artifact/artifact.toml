kind = "web"
previewPath = "/"
title = "Partner Status Agent"
description = "A partner operations demo with read-only Salesforce sample registrations, synthetic quote status, cited public guidance, and human-controlled support requests."
version = "1.0.0"
id = "artifacts/partner-status-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18739

[services.development]
run = "pnpm --filter @workspace/partner-status-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/partner-status-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/partner-status-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18739"
BASE_PATH = "/"
