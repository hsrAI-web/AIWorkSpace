[project]
name = "partner-operations-agent"
version = "0.1.0"
description = "Stateful LangChain and LangGraph partner operations agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
partner-agent = "partner_agent_graph.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "partner_agent_graph"
module-root = "src"
