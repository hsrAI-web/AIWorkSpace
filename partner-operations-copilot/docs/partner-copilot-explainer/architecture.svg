<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#285f4e"/></marker></defs><rect width="1680" height="1080" fill="#f5f2e9"/><text x="56" y="68" fill="#203b3b" font-family="Arial,sans-serif" font-size="42" font-weight="700">How Partner Desk is connected</text><text x="58" y="108" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">Read-only Salesforce demo records · synthetic quotes · cited public knowledge</text><rect x="55" y="180" width="450" height="690" rx="24" fill="#ebece4"/><text x="80" y="220" fill="#285f4e" font-family="Arial,sans-serif" font-size="19" font-weight="700">01  BROWSER</text><rect x="560" y="180" width="450" height="690" rx="24" fill="#ebece4"/><text x="585" y="220" fill="#285f4e" font-family="Arial,sans-serif" font-size="19" font-weight="700">02  API STACK</text><rect x="1065" y="180" width="560" height="690" rx="24" fill="#ebece4"/><text x="1090" y="220" fill="#285f4e" font-family="Arial,sans-serif" font-size="19" font-weight="700">03  AGENT RUNTIME</text><rect x="75" y="260" width="410" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="99" y="303" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">React + Vite</text><text x="99" y="337" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Partner / staff demo pages</text><text x="99" y="364" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Wouter navigation</text><text x="99" y="391" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Answer, citations, execution trace</text><rect x="75" y="460" width="410" height="130" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="99" y="503" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Typed request hook</text><text x="99" y="537" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Orval + React Query</text><text x="99" y="564" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">OpenAPI-generated request/response</text><rect x="75" y="665" width="410" height="165" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="99" y="708" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Browser localStorage</text><text x="99" y="742" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">View preference + thread ID</text><text x="99" y="769" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Support requests + staff responses</text><text x="99" y="796" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Queue is not shared across devices</text><rect x="580" y="260" width="410" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="604" y="303" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Express · public /api</text><text x="604" y="337" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Zod input + demo usage caps</text><text x="604" y="364" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Salesforce Connected App REST read</text><text x="604" y="391" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Fixed Developer Edition allowlist</text><rect x="580" y="460" width="410" height="130" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="604" y="503" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">FastAPI · loopback</text><text x="604" y="537" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Python on 127.0.0.1:8000</text><text x="604" y="564" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Partner/thread checks → /agent/run</text><text x="604" y="591" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Uses scoped registration data</text><rect x="580" y="665" width="410" height="165" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="604" y="708" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">PostgreSQL checkpoints</text><text x="604" y="742" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">LangGraph AsyncPostgresSaver</text><text x="604" y="769" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Conversation + execution state</text><text x="604" y="796" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Not the support-request queue</text><rect x="1085" y="260" width="520" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="1109" y="303" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">LangGraph control flow</text><text x="1109" y="337" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Safety + partner-scope gates</text><text x="1109" y="364" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Exact-ID route → bounded tool loop</text><text x="1109" y="391" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Requested-source coverage check</text><rect x="1085" y="460" width="520" height="130" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="1109" y="503" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">LangChain read-only tools</text><text x="1109" y="537" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Salesforce registration lookup</text><text x="1109" y="564" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Synthetic quote · local guide · public RAG</text><text x="1109" y="591" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Sources return to the model</text><rect x="1085" y="665" width="520" height="165" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="1109" y="708" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Nebius Token Factory</text><text x="1109" y="742" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Chat: Qwen3-30B-A3B-Instruct-2507</text><text x="1109" y="769" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Embeddings: Qwen3-Embedding-8B</text><text x="1109" y="796" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Credentials stay server-side</text><path d="M485 330 L580 330" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M785 405 L785 460" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M990 510 L1040 510 L1040 330 L1085 330" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1345 405 L1345 460" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1405 460 L1405 405" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M785 590 L785 665" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1605 370 L1640 370 L1640 625 L1345 625 L1345 665" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M280 460 L280 405" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M280 590 L280 665" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 7"/><text x="72" y="928" fill="#285f4e" font-family="Arial,sans-serif" font-size="23" font-weight="700">READS ARE SOURCE-BOUNDED. WRITES ARE HUMAN-CONTROLLED.</text><text x="72" y="971" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">Salesforce reads are fixed to one Developer Edition org and approved demo registrations; quotes remain synthetic.</text><text x="72" y="1002" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">The model cannot update Salesforce, send email, or approve pricing, credit, or eligibility.</text><text x="72" y="1033" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">The role switch is not authentication; do not use real partner data in this public demo.</text></svg>