<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1020" viewBox="0 0 1680 1020"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#285f4e"/></marker></defs><rect width="1680" height="1020" fill="#f5f2e9"/><text x="56" y="68" fill="#203b3b" font-family="Arial,sans-serif" font-size="42" font-weight="700">What happens after “Get an answer”</text><text x="58" y="108" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">Record lookup, semantic public-source retrieval, or a deliberate human handoff</text><rect x="40" y="205" width="240" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="64" y="248" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Question</text><text x="64" y="282" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Selected demo partner</text><text x="64" y="309" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Partner-prefixed thread</text><text x="64" y="336" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Validate before execution</text><rect x="330" y="205" width="260" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="354" y="248" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Safety + scope</text><text x="354" y="282" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Sensitive or unsupported?</text><text x="354" y="309" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Human route when required</text><text x="354" y="336" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">No model call on sensitive path</text><rect x="640" y="205" width="260" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="664" y="248" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">ID planner</text><text x="664" y="282" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Exact IDs → scoped lookups</text><text x="664" y="309" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Up to 3 IDs per plan</text><text x="664" y="336" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">No model tool-selection step</text><rect x="950" y="205" width="260" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="974" y="248" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Routine agent</text><text x="974" y="282" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Nebius selects read-only tools</text><text x="974" y="309" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Retrieves before summarizing</text><text x="974" y="336" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Thread context resolves follow-ups</text><rect x="1260" y="205" width="365" height="145" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="1284" y="248" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Evidence check</text><text x="1284" y="282" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Requested records / sources present?</text><text x="1284" y="309" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Missing source → withhold answer</text><text x="1284" y="336" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Citations + trace in response</text><path d="M280 275 L330 275" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M590 275 L640 275" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><text x="596" y="254" fill="#285f4e" font-family="Arial,sans-serif" font-size="18" font-weight="400">routine</text><path d="M900 275 L950 275" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1210 275 L1260 275" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><rect x="950" y="425" width="260" height="140" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="974" y="468" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Four read-only tools</text><text x="974" y="502" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Salesforce registration / demo quote</text><text x="974" y="529" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Local guide / public knowledge RAG</text><text x="974" y="556" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Partner scope + evidence</text><path d="M1080 350 L1080 425" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1080 425 L1080 350" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><rect x="1260" y="425" width="365" height="140" rx="18" fill="#ffffff" stroke="#d9e2db" stroke-width="2"/><text x="1284" y="468" fill="#203b3b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Visible result</text><text x="1284" y="502" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Answer + source timestamps</text><text x="1284" y="529" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Expandable execution trace</text><text x="1284" y="556" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Or labeled non-AI fallback</text><path d="M1440 350 L1440 425" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="685" width="260" height="135" rx="18" fill="#fbf2dc" stroke="#d7bc7c" stroke-width="2"/><text x="354" y="728" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Human handoff</text><text x="354" y="762" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Prepare a support form</text><text x="354" y="789" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">No decision was made</text><text x="354" y="816" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">No automatic submission</text><path d="M460 350 L460 685" fill="none" stroke="#bd9446" stroke-width="3" marker-end="url(#a)"/><text x="478" y="550" fill="#285f4e" font-family="Arial,sans-serif" font-size="18" font-weight="400">sensitive / unsupported</text><rect x="640" y="685" width="260" height="135" rx="18" fill="#fbf2dc" stroke="#d7bc7c" stroke-width="2"/><text x="664" y="728" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Partner confirms</text><text x="664" y="762" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Review category + context</text><text x="664" y="789" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Click Save support request</text><text x="664" y="816" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Browser-local write</text><rect x="950" y="685" width="260" height="135" rx="18" fill="#fbf2dc" stroke="#d7bc7c" stroke-width="2"/><text x="974" y="728" fill="#203b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700">Staff demo review</text><text x="974" y="762" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Assign owner / update status</text><text x="974" y="789" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Record a human response</text><text x="974" y="816" fill="#5a6d66" font-family="Arial,sans-serif" font-size="19" font-weight="400">Same-browser queue</text><path d="M590 750 L640 750" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M900 750 L950 750" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)"/><path d="M1260 325 L1230 325 L1230 620 L460 620 L460 685" fill="none" stroke="#285f4e" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 7"/><text x="700" y="608" fill="#5a6d66" font-family="Arial,sans-serif" font-size="18" font-weight="400">Missing evidence / uncited ID</text><text x="60" y="905" fill="#285f4e" font-family="Arial,sans-serif" font-size="22" font-weight="700">RECOVERY CONTROLS</text><text x="60" y="944" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">At most 3 executed tool rounds · bounded recent model context · timeout / retry limits</text><text x="60" y="975" fill="#5a6d66" font-family="Arial,sans-serif" font-size="21" font-weight="400">Evidence checks verify expected records and sources; they are not a fact-check of every generated sentence.</text></svg>